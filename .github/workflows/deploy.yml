name: Deploy HorseTrack API

on:
  push:
    branches:
      - main
      - deploy
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: horsetrack-test-deployment
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        env:
          IMAGE_TAG: horsetrack-api:${{ github.sha }}
        run: docker build --pull --tag "$IMAGE_TAG" .

      - name: Replace application container
        env:
          IMAGE_TAG: horsetrack-api:${{ github.sha }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          VNPAY_TMN_CODE: ${{ secrets.VNPAY_TMN_CODE }}
          VNPAY_HASH_SECRET: ${{ secrets.VNPAY_HASH_SECRET }}
          VNPAY_RETURN_URL: ${{ secrets.VNPAY_RETURN_URL }}
          VNPAY_FRONTEND_RESULT_URL: ${{ secrets.VNPAY_FRONTEND_RESULT_URL }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
        run: |
          set -euo pipefail
          # QA H4: mật khẩu DB và JWT secret không còn giá trị mặc định trong code - thiếu thì dừng trước khi gỡ container đang chạy
          for name in DB_PASSWORD JWT_SECRET; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Chưa đặt GitHub Secret $name" >&2
              exit 1
            fi
          done
          # Chỉ truyền biến có giá trị: secret bỏ trống thì ứng dụng dùng giá trị mặc định trong application.properties
          ENV_FILE="$(mktemp)"
          trap 'rm -f "$ENV_FILE"' EXIT
          for name in DB_PASSWORD JWT_SECRET DB_URL DB_USERNAME MAIL_USERNAME MAIL_PASSWORD VNPAY_TMN_CODE VNPAY_HASH_SECRET VNPAY_RETURN_URL VNPAY_FRONTEND_RESULT_URL CORS_ALLOWED_ORIGINS; do
            if [[ -n "${!name:-}" ]]; then
              printf '%s=%s\n' "$name" "${!name}" >> "$ENV_FILE"
            fi
          done
          docker rm --force horsetrack-service 2>/dev/null || true
          docker run --detach \
            --name horsetrack-service \
            --restart unless-stopped \
            --publish 8080:8080 \
            --env-file "$ENV_FILE" \
            "$IMAGE_TAG"

          for attempt in {1..12}; do
            if [[ "$(docker inspect --format '{{.State.Running}}' horsetrack-service)" != "true" ]]; then
              docker logs horsetrack-service
              exit 1
            fi
            sleep 5
          done

      - name: Prune old HorseTrack images
        if: success()
        run: |
          docker image prune --force
          docker images horsetrack-api --format '{{.Repository}}:{{.Tag}}' \
            | grep -v '^horsetrack-api:${{ github.sha }}$' \
            | xargs --no-run-if-empty docker image rm || true
