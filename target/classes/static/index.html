<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Giao Diện Web - HorseTrack</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            padding: 20px;
            text-align: center;
        }

        .box {
            background: white;
            border: 1px solid #ccc;
            padding: 30px;
            width: 400px;
            margin: 0 auto;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        input, button {
            margin: 10px 0;
            padding: 10px;
            width: 90%;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        .checkbox-group {
            text-align: left;
            margin-left: 5%;
            font-size: 14px;
            color: #555;
        }

        .checkbox-group input {
            width: auto;
            margin-right: 10px;
        }

        button {
            background-color: #007bff;
            color: white;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }

        button:hover {
            background-color: #0056b3;
        }

        .btn-logout {
            background-color: #dc3545;
        }

        .btn-logout:hover {
            background-color: #c82333;
        }

        .btn-switch {
            background-color: transparent;
            color: #007bff;
            border: 1px solid #007bff;
        }

        .btn-switch:hover {
            background-color: #f8f9fa;
            color: #0056b3;
        }

        #welcome-screen, #register-screen {
            display: none;
        }

        .error-msg {
            color: red;
            font-size: 14px;
            margin-top: 10px;
        }

        .success-msg {
            color: green;
            font-size: 14px;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<!-- MÀN HÌNH 1: FORM ĐĂNG NHẬP -->
<div class="box" id="login-screen">
    <h2>🏇 HorseTrack Login</h2>
    <input type="text" id="username" placeholder="Tên đăng nhập" value="chu_ngua_lanhoang">
    <input type="password" id="password" placeholder="Mật khẩu" value="Password123!">
    <button onclick="testLoginAPI()">Đăng Nhập Ngay</button>
    <p class="error-msg" id="login-msg"></p>
    <hr style="border: 0.5px solid #eee; margin: 20px 0;">
    <button class="btn-switch" onclick="switchScreen('register-screen')">Chưa có tài khoản? Đăng ký ngay</button>
</div>

<!-- MÀN HÌNH 2: FORM ĐĂNG KÝ -->
<div class="box" id="register-screen">
    <h2>📝 Đăng Ký Chủ Ngựa</h2>
    <input type="text" id="reg-username" placeholder="Tên đăng nhập (*)">
    <input type="text" id="reg-fullName" placeholder="Họ và tên (*)">
    <input type="email" id="reg-email" placeholder="Email (*)">
    <input type="text" id="reg-phone" placeholder="Số điện thoại">
    <input type="password" id="reg-password" placeholder="Mật khẩu (tối thiểu 8 ký tự) (*)">
    <input type="password" id="reg-confirmPassword" placeholder="Xác nhận mật khẩu (*)">
    <input type="text" id="reg-billingAddress" placeholder="Địa chỉ thanh toán">
    <input type="text" id="reg-taxCode" placeholder="Mã số thuế">
    <div class="checkbox-group">
        <label><input type="checkbox" id="reg-agreeToTerms"> Tôi đồng ý với Điều khoản (*) </label>
    </div>
    <button onclick="testRegisterAPI()" style="background-color: #28a745;">Đăng Ký</button>
    <p id="reg-msg" class="error-msg"></p>
    <hr style="border: 0.5px solid #eee; margin: 20px 0;">
    <button class="btn-switch" onclick="switchScreen('login-screen')">Đã có tài khoản? Quay lại Đăng nhập</button>
</div>

<!-- MÀN HÌNH 3: TRANG CHỦ -->
<div class="box" id="welcome-screen">
    <h2>🎉 Đăng nhập thành công!</h2>
    <h3 id="welcome-text" style="color: #28a745;"></h3>
    <p>Hệ thống tự động lưu bạn vào bộ nhớ trình duyệt (localStorage).</p>
    <button class="btn-logout" onclick="testLogout()">Đăng Xuất</button>
</div>

<script>
    // 1. Tự động kiểm tra Đăng nhập khi mở web
    window.onload = function () {
        const savedUser = localStorage.getItem("horseTrackUser");
        if (savedUser) {
            const user = JSON.parse(savedUser);
            showWelcomeScreen(user.fullName);
        }
    };

    // 2. Hàm chuyển đổi qua lại giữa các màn hình
    function switchScreen(screenId) {
        document.getElementById("login-screen").style.display = "none";
        document.getElementById("register-screen").style.display = "none";
        document.getElementById("welcome-screen").style.display = "none";

        document.getElementById(screenId).style.display = "block";

        // Xóa sạch các thông báo báo lỗi cũ
        document.getElementById("login-msg").innerText = "";
        document.getElementById("reg-msg").innerText = "";
        document.getElementById("reg-msg").className = "error-msg";
    }

    // 3. Hàm gọi API Đăng Nhập
    async function testLoginAPI() {
        const u = document.getElementById("username").value;
        const p = document.getElementById("password").value;
        const msgBox = document.getElementById("login-msg");

        msgBox.innerText = "Đang kiểm tra...";

        try {
            const response = await fetch('http://localhost:8080/api/accounts/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: u, password: p})
            });
            const result = await response.json();

            if (response.ok) {
                localStorage.setItem("horseTrackUser", JSON.stringify(result.data));
                showWelcomeScreen(result.data.fullName);
            } else {
                msgBox.innerText = result.message || "Lỗi đăng nhập!";
            }
        } catch (error) {
            msgBox.innerText = "Máy chủ Spring Boot chưa bật!";
        }
    }

    // 4. Hàm gọi API Đăng Ký
    async function testRegisterAPI() {
        const msgBox = document.getElementById("reg-msg");
        msgBox.className = "error-msg";
        msgBox.innerText = "Đang xử lý...";

        // Đóng gói dữ liệu từ các ô nhập liệu vào một cục JSON
        const payload = {
            username: document.getElementById("reg-username").value,
            fullName: document.getElementById("reg-fullName").value,
            email: document.getElementById("reg-email").value,
            phone: document.getElementById("reg-phone").value,
            password: document.getElementById("reg-password").value,
            confirmPassword: document.getElementById("reg-confirmPassword").value,
            billingAddress: document.getElementById("reg-billingAddress").value,
            taxCode: document.getElementById("reg-taxCode").value,
            agreeToTerms: document.getElementById("reg-agreeToTerms").checked
        };

        try {
            // Bắn dữ liệu về API đăng ký
            const response = await fetch('http://localhost:8080/api/accounts/register-owner', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            const result = await response.json();

            if (response.ok) {
                msgBox.className = "success-msg";
                msgBox.innerText = "Đăng ký thành công! Đang chuyển sang Đăng nhập...";

                // Mẹo nhỏ: Tự động copy tài khoản vừa tạo qua màn hình đăng nhập cho bạn đỡ phải gõ lại
                document.getElementById("username").value = payload.username;
                document.getElementById("password").value = payload.password;

                // Tự động nhảy sang trang đăng nhập sau 1.5 giây
                setTimeout(() => switchScreen('login-screen'), 1500);
            } else {
                msgBox.innerText = result.message || "Đăng ký thất bại!";
            }
        } catch (error) {
            msgBox.innerText = "Máy chủ Spring Boot chưa bật!";
        }
    }

    // 5. Hàm Đăng xuất
    function testLogout() {
        localStorage.removeItem("horseTrackUser");
        switchScreen('login-screen');
    }

    // 6. Hàm hiển thị Trang chủ
    function showWelcomeScreen(fullName) {
        document.getElementById("login-screen").style.display = "none";
        document.getElementById("register-screen").style.display = "none";
        document.getElementById("welcome-screen").style.display = "block";
        document.getElementById("welcome-text").innerText = "Xin chào Chủ Ngựa: " + fullName;
    }
</script>
</body>
</html>
