# Cong chay ung dung
server.port=8080

# Ket noi toi database EquineCareDB tren SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=EquineCareDB;encrypt=false;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Cau hinh JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Cau hinh Spring MVC Path Matching Strategy
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Cau hinh duong dan Swagger UI kiem thu API
springdoc.swagger-ui.path=/swagger-ui.html
