spring.datasource.password=choig@ycung@nh123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Cau hinh JPA / Hibernate
# none: Hibernate KHONG tu tao/sua bang, khoa ngoai tren DB. Cau truc DB do nhom quan ly bang script SQL.
# (Truoc day dung update khien Hibernate tu tao bang thua nhu care_tasks, training_sessions va khoa ngoai trung lap.)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Cau hinh Spring MVC Path Matching Strategy
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Cau hinh duong dan Swagger UI kiem thu API
springdoc.swagger-ui.path=/swagger-ui.html

# Cau hinh CORS: dia chi FE duoc phep goi API (nhieu dia chi cach nhau bang dau phay)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Cau hinh JWT Token (Secret key toi thieu 256 bits cho HS256)
# Access token: 15 phut = 900000 ms; het han thi goi /api/v1/auth/refresh de lay token moi
jwt.secret=${JWT_SECRET:HorseTrackEquineCareSecretKey2026SecureJwtAuthenticationSWP391Group3}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
# Refresh token: 7 ngay = 604800000 ms
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Cau hinh gui email qua SMTP (mac dinh Gmail).
# Voi Gmail: bat xac minh 2 buoc va tao "App Password" 16 ky tu, KHONG dung mat khau Gmail that.
# Dat bien moi truong MAIL_USERNAME va MAIL_PASSWORD; khong ghi mat khau vao file nay.
# Neu chua dat MAIL_USERNAME: server chay CHE DO DEV, noi dung email (ke ca OTP) chi in ra console.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.default-encoding=UTF-8
# Dia chi va ten nguoi gui hien trong email (mac dinh = MAIL_USERNAME)
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.mail.from-name=${MAIL_FROM_NAME:HorseTrack EquineCare}
# Thoi gian toi da (giay) request cho email gui xong de bao ket qua (OTP doi mat khau, tai khoan nhan vien); qua han email van gui o nen
app.mail.wait-seconds=${MAIL_WAIT_SECONDS:8}

# Cau hinh OTP: dung 1 lan, hieu luc 120 giay, nhap sai toi da 5 lan, cho 30 giay giua 2 lan gui lai
app.otp.ttl-seconds=${OTP_TTL_SECONDS:120}
app.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
app.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:30}