# Cong chay ung dung
server.port=8080

# Ket noi toi database EquineCareDB tren SQL Server
# Mat khau DB va JWT secret KHONG ghi o day (QA H4): dat bien moi truong DB_PASSWORD, JWT_SECRET
# (server: GitHub Secrets qua deploy.yml; may ca nhan: file config/secrets.properties, da gitignore, mau o config/secrets.example.properties)
spring.config.import=optional:file:./config/secrets.properties
spring.datasource.url=${DB_URL:jdbc:sqlserver://103.245.237.252:1433;databaseName=EquineCareDB;encrypt=false;trustServerCertificate=true;}
spring.datasource.username=${DB_USERNAME:duangua}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Cau hinh JPA / Hibernate
# none: Hibernate KHONG tu tao/sua bang, khoa ngoai tren DB. Cau truc DB do nhom quan ly bang script SQL.
# (Truoc day dung update khien Hibernate tu tao bang thua nhu care_tasks, training_sessions va khoa ngoai trung lap.)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Cau hinh Spring MVC Path Matching Strategy
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Cau hinh duong dan Swagger UI kiem thu API
springdoc.swagger-ui.path=/swagger-ui.html

# Cau hinh CORS: dia chi FE duoc phep goi API (nhieu dia chi cach nhau bang dau phay)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Cau hinh JWT Token (Secret key toi thieu 256 bits cho HS256)
# Access token: 15 phut = 900000 ms; het han thi goi /api/v1/auth/refresh de lay token moi
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
# Refresh token: 7 ngay = 604800000 ms
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Cau hinh gui email qua SMTP (mac dinh Gmail).
# Voi Gmail: bat xac minh 2 buoc va tao "App Password" 16 ky tu, KHONG dung mat khau Gmail that.
# Dat bien moi truong MAIL_USERNAME va MAIL_PASSWORD; khong ghi mat khau vao file nay.
# Neu chua dat MAIL_USERNAME: server chay CHE DO DEV, noi dung email (ke ca OTP) chi in ra console.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.default-encoding=UTF-8
# Dia chi va ten nguoi gui hien trong email (mac dinh = MAIL_USERNAME)
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.mail.from-name=${MAIL_FROM_NAME:HorseTrack EquineCare}
# Thoi gian toi da (giay) request cho email gui xong de bao ket qua (OTP doi mat khau, tai khoan nhan vien); qua han email van gui o nen
app.mail.wait-seconds=${MAIL_WAIT_SECONDS:8}

# Cau hinh OTP: dung 1 lan, hieu luc 300 giay (5 phut), nhap sai toi da 5 lan, cho 30 giay giua 2 lan gui lai
app.otp.ttl-seconds=${OTP_TTL_SECONDS:300}
# Xác nhận tài khoản nhân viên: đường dẫn nút "Xác nhận tài khoản" trong email (đặt địa chỉ công khai của server khi triển khai),
# hạn liên kết, và trang đăng nhập FE để chuyển về sau khi xác nhận (bỏ trống thì hiện trang thông báo của backend)
app.staff.confirm-url=${STAFF_CONFIRM_URL:http://localhost:8080/api/v1/auth/confirm-account}
app.staff.confirm-ttl-hours=${STAFF_CONFIRM_TTL_HOURS:72}
app.staff.login-url=${STAFF_LOGIN_URL:}
app.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
app.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:30}
# Thoi luong mac dinh mot buoi tap (phut) - dung de chan phan cong Groom 2 buoi trung gio (BR34)
app.training.session-duration-minutes=${TRAINING_SESSION_DURATION_MINUTES:60}
# Chu kỳ kiểm tra giáo án PENDING đã có buổi tập được Groom xác nhận và tới ngày bắt đầu để chuyển ACTIVE (mặc định 5 phút)
app.training.activate-check-ms=${TRAINING_ACTIVATE_CHECK_MS:300000}
# Ngưỡng mặc định của buổi tập khi HLV không đặt: vượt ngưỡng thì buổi tập tự tạm dừng chờ HLV (F22-02)
app.training.default-max-heart-rate=${TRAINING_DEFAULT_MAX_HEART_RATE:180}
app.training.default-max-speed-kmh=${TRAINING_DEFAULT_MAX_SPEED_KMH:60}
# Ảnh đại diện tối đa 1 MB, giấy tờ hồ sơ ngựa tối đa 10 MB (kiểm tra trong service); giới hạn multipart rộng hơn một chút để báo lỗi rõ ràng
spring.servlet.multipart.max-file-size=11MB
spring.servlet.multipart.max-request-size=12MB

# SLA Monitor (BR_05): viec cham soc qua 45 phut sau gio hen chua xong -> canh bao Club Manager; quet moi 5 phut
app.care.sla-minutes=${CARE_SLA_MINUTES:45}
# Groom được xác nhận hoàn thành sớm nhất bao nhiêu phút trước giờ hẹn của việc
app.care.early-complete-minutes=${CARE_EARLY_COMPLETE_MINUTES:30}
app.care.sla-check-ms=${CARE_SLA_CHECK_MS:300000}
# Email nhắc bác sĩ lịch tiêm phòng / tẩy giun của hôm nay (mặc định 07:00 mỗi ngày)
app.vaccination.reminder-cron=${VACCINATION_REMINDER_CRON:0 0 7 * * *}

# ===== Hóa đơn & thanh toán (BR_12 - BR_15) =====
# Hạn thanh toán: phát hành ngày 1, hạn 10 ngày (ngày 10); phí trễ hạn 1%/ngày trên tiền gốc; phí kích hoạt lại 3.000.000 VND
app.billing.payment-term-days=${BILLING_PAYMENT_TERM_DAYS:10}
app.billing.late-fee-rate-per-day=${BILLING_LATE_FEE_RATE:0.01}
app.billing.reactivation-fee=${BILLING_REACTIVATION_FEE:3000000}
app.billing.warning-days=${BILLING_WARNING_DAYS:20}
app.billing.suspension-days=${BILLING_SUSPENSION_DAYS:25}
app.billing.termination-days=${BILLING_TERMINATION_DAYS:60}

# ===== VNPay - CHỈ môi trường Sandbox =====
# Đăng ký tài khoản test tại https://sandbox.vnpayment.vn/devreg/ để nhận vnp_TmnCode và vnp_HashSecret qua email.
# Đặt bằng biến môi trường VNPAY_TMN_CODE / VNPAY_HASH_SECRET (IntelliJ: Run > Edit Configurations), KHÔNG ghi vào file này.
app.vnpay.tmn-code=${VNPAY_TMN_CODE:}
app.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
app.vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
app.vnpay.api-url=${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
# VNPay chuyển trình duyệt về đây sau khi thanh toán
app.vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/api/v1/payments/vnpay/return}
# Trang kết quả của frontend sau khi thanh toán (mặc định danh sách hóa đơn của chủ ngựa); đặt rỗng để Return URL trả JSON
app.vnpay.frontend-result-url=${VNPAY_FRONTEND_RESULT_URL:http://localhost:5173/owner/invoices}
app.vnpay.expire-minutes=${VNPAY_EXPIRE_MINUTES:15}
# Khoảng cách tối thiểu giữa 2 lần hỏi VNPay (querydr) cùng một giao dịch; hỏi sớm hơn VNPay trả mã 94
app.vnpay.querydr-interval-seconds=${VNPAY_QUERYDR_INTERVAL_SECONDS:300}
# Khi trình duyệt quay về, server hỏi lại VNPay (querydr) để xác minh - dùng được trên localhost khi VNPay không gọi được IPN
app.vnpay.verify-on-return=${VNPAY_VERIFY_ON_RETURN:true}
# querydr của VNPay không trả lời được (mã 99 / 03, lỗi mạng): chấp nhận dữ liệu Return đã ký HMAC hợp lệ, cùng bộ kiểm tra như IPN
app.vnpay.trust-signed-return=${VNPAY_TRUST_SIGNED_RETURN:true}
